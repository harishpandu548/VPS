version: "3.9"

services:
  server:
    build: ./server
    container_name: express-server
    ports:
      - "5000:5000"
    networks:
      - fullstack-net
    restart: unless-stopped
  client:
    build: ./client
    container_name: react-client
    ports:
      - "3000:3000"
    networks:
      - fullstack-net
    depends_on:
      - server
    restart: unless-stopped

# private LAN network between containers so containers can talk
networks:
  fullstack-net:
    driver: bridge