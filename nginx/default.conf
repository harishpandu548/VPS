server {
    listen 80;
    server_name aws-vpss.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aws-vpss.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/aws-vpss.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aws-vpss.duckdns.org/privkey.pem;

    location /api/ {
        proxy_pass http://server:5000/api/;
    }

    location / {
        proxy_pass http://client:3000;
    }
}